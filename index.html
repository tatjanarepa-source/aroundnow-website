<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d1322" id="themeColor" />
<meta name="color-scheme" content="dark light" />
<title>AroundNow</title>
<script>
  // Light or dark before anything is drawn: the phone's setting, unless chosen in the app (app.js keeps it up to date)
  (function () {
    var mode = "";
    try { mode = JSON.parse(localStorage.getItem("aroundnow-prefs") || "{}").theme || ""; } catch (e) { mode = ""; }
    if (mode !== "light" && mode !== "dark") {
      mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", mode);
    document.getElementById("themeColor").setAttribute("content", mode === "light" ? "#f7f5f1" : "#0d1322");
  })();
</script>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700&display=swap" />
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app" id="app">

  <div id="map" class="map"></div>

  <header class="topbar" id="topbar">
    <span class="logo">Around<span>Now</span></span>
    <span class="topbar-rule" aria-hidden="true"></span>
    <button type="button" id="placeBtn" class="place-btn" data-act="sheet" data-v="place"></button>
    <button type="button" id="addBtn" class="add-btn" data-act="add" aria-label="Add a class">
      <svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <section id="panel" class="panel" aria-label="Results">
    <div class="handle drag-zone" aria-hidden="true"><span></span></div>
    <div id="filters" class="filters"></div>
    <div class="results-head drag-zone">
      <span id="countLabel" class="count" aria-live="polite"></span>
      <div class="head-actions">
        <button type="button" id="filtersBtn" class="chip" data-act="sheet" data-v="filters"></button>
        <button type="button" id="panelBtn" class="link-btn" data-act="panel"></button>
      </div>
    </div>
    <div id="list" class="list"></div>
  </section>

  <div id="sheet" class="overlay" hidden></div>
  <div id="detail" class="overlay" hidden></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/supabase/supabase.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW registration failed", e));
    });
  }
</script>
</body>
</html>
