<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>AroundNow</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" />
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <span class="logo">Around<span>Now</span></span>
    <span class="seg" id="uiSwitch">
      <button type="button" data-act="ui" data-v="en" aria-label="English">EN</button>
      <button type="button" data-act="ui" data-v="ru" aria-label="Русский">RU</button>
    </span>
  </header>

  <section id="filters" class="filters" aria-label="Filters"></section>

  <div class="results-head">
    <span id="countLabel" aria-live="polite"></span>
    <button type="button" id="clearBtn" class="link-btn" data-act="clear" hidden></button>
  </div>

  <main class="content">
    <div id="list" class="list"></div>
    <div id="mapWrap" class="map-wrap" hidden>
      <div id="map"></div>
      <p id="mapNote" class="map-note"></p>
    </div>
  </main>

  <button type="button" id="viewToggle" class="fab" data-act="view"></button>

  <div id="sheet" class="overlay" hidden></div>
  <div id="detail" class="overlay" hidden></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW registration failed", e));
    });
  }
</script>
</body>
</html>
